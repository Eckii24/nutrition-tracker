[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nutrition-tracker"
version = "0.1.0"
description = "Deterministic local CLI backend for a file-based nutrition tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.22",
  "typer>=0.12,<1.0",
]

[project.scripts]
nutrition = "nutrition_tracker.presentation.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
  "ty>=0.0.1a14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.hatch.build.targets.wheel]
packages = ["src/nutrition_tracker"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/pyproject.toml",
  "/schemas",
]
